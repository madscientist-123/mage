name: Engine Coach XMage X1 Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - engine-coach-xmage-x1
    paths:
      - 'Mage.Tests/src/test/java/org/mage/test/enginecoach/**'
      - '.github/workflows/engine-coach-x1.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'Mage.Tests/src/test/java/org/mage/test/enginecoach/**'
      - '.github/workflows/engine-coach-x1.yml'

jobs:
  x1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build XMage dependencies
        run: mvn -B -pl Mage.Tests -am -DskipTests install
      - name: Run Engine Coach X1 smoke tests
        run: mvn -B -pl Mage.Tests -Dtest=EngineCoachXMageSmokeTest test
